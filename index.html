<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Flip 7</title>
<style>
  :root{
    --cream:#f4ecd8;
    --cream-2:#e9dfc4;
    --ink:#231a12;
    --ink-soft: rgba(35,26,18,0.6);
    --ink-faint: rgba(35,26,18,0.4);
    --gold:#c9922e;
    --gold-2:#a9793a;
    --burgundy:#8c3038;
    --ice:#4f8fa6;
    --amber:#c97a3d;
    --green-active:#2f9d5c;
    --paper:#faf6ec;
    --line: rgba(35,26,18,0.14);
    --line-soft: rgba(35,26,18,0.08);
    --panel: #fbf9f4;
    --shadow: 0 6px 18px rgba(35,26,18,0.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background: #ffffff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  #app{
    max-width: 760px;
    margin: 0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding: 14px 12px 96px;
  }

  .brand{
    text-align:center;
    padding: 10px 0 4px;
  }
  .brand .logo-img{
    width: min(320px, 82vw);
    height:auto;
    display:inline-block;
  }
  .brand p{
    margin:6px 0 0; color: var(--ink-soft); font-size:13px; letter-spacing:0.04em;
  }
  .brand.brand-compact{ padding: 2px 0 6px; }
  .logo-img.logo-img-sm{ width: min(180px, 55vw); }

  /* ---------- Setup screen ---------- */
  .setup-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px 18px;
    margin-top: 18px;
    box-shadow: var(--shadow);
  }
  .setup-label{
    font-size:12px; text-transform:uppercase; letter-spacing:0.12em; color: var(--gold-2);
    margin-bottom:10px; font-weight:700;
  }
  .stepper{
    display:flex; align-items:center; justify-content:center; gap:18px;
    margin-bottom: 18px;
  }
  .stepper button{
    width:44px;height:44px; border-radius:50%; border:1px solid rgba(201,146,46,0.45);
    background: #fff; color: var(--gold-2); font-size:22px; line-height:1;
    cursor:pointer;
  }
  .stepper button:active{ transform: scale(0.94); }
  .stepper button:disabled{ opacity:0.3; }
  .stepper .count{
    font-family: Georgia, serif; font-size: 40px; min-width: 54px; text-align:center;
  }
  .name-list{ display:flex; flex-direction:column; gap:8px; margin-bottom: 18px; }
  .name-row{ display:flex; align-items:center; gap:10px; }
  .name-row .seat-dot{
    width:26px;height:26px;border-radius:50%; flex:none;
    background: rgba(201,146,46,0.12); border:1px solid rgba(201,146,46,0.4);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--gold-2);
  }
  .name-row input{
    flex:1; background: #fff; border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; color:var(--ink); font-size:14.5px;
  }
  .name-row input:focus{ outline:2px solid var(--gold); border-color:transparent; }
  .room-code{
    text-align:center; font-family: Georgia, serif; font-size:34px; letter-spacing:0.14em;
    font-weight:700; color:var(--gold-2); background:#fff; border:1.5px dashed rgba(201,146,46,0.5);
    border-radius:12px; padding:12px 0; margin-bottom:18px; cursor:pointer;
  }
  .room-code:active{ transform: scale(0.98); }

  .btn-primary{
    width:100%; padding:15px; border:none; border-radius:14px;
    background: linear-gradient(160deg, var(--gold), var(--gold-2));
    color:#fff; font-weight:700; font-size:16px; letter-spacing:0.02em;
    cursor:pointer; box-shadow: var(--shadow);
  }
  .btn-primary:active{ transform: translateY(1px); }
  .btn-ghost{
    width:100%; padding:13px; border-radius:14px; margin-top:10px;
    background:transparent; border:1px solid var(--line); color:var(--ink);
    font-size:14px; cursor:pointer;
  }

  /* ---------- Game screen ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 4px 4px 12px;
    font-size:12.5px; color: var(--ink-soft);
  }
  .topbar .chip{
    background: var(--panel); border:1px solid var(--line);
    padding:5px 10px; border-radius:999px; display:flex; align-items:center; gap:6px;
  }
  .topbar .chip b{ color:var(--gold-2); font-weight:700; }

  .deck-zone{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 6px 0 18px;
  }
  #deck{
    width:64px; height:90px; border-radius:9px;
    background:
      repeating-linear-gradient(45deg, rgba(201,146,46,0.14) 0 4px, transparent 4px 9px),
      linear-gradient(160deg, #fff8ea, #f3e6c6);
    border: 1.5px solid rgba(201,146,46,0.55);
    box-shadow: 0 0 0 3px rgba(35,26,18,0.05), var(--shadow);
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  #deck::before{
    content:'7'; font-family: Georgia, serif; font-size:26px; color: var(--gold-2); opacity:0.85;
  }
  #deck.pulse{ animation: pulse 0.5s ease; }
  @keyframes pulse{ 50%{ transform: scale(0.94); } }
  .deck-count{ margin-top:8px; font-size:11.5px; color: var(--ink-soft); letter-spacing:0.06em; }

  .turn-banner{
    text-align:center; margin-bottom:10px;
  }
  .turn-banner .who{
    font-family: Georgia, serif; font-size:19px; color: var(--gold-2);
  }
  .turn-banner .hint{ font-size:12px; color: var(--ink-soft); margin-top:2px; }

  .players{
    display:flex; flex-direction:column; gap:10px;
  }
  .player{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding: 11px 12px;
    transition: border-color .25s, box-shadow .25s, background .25s;
  }
  .player.is-turn{
    border-color: var(--gold);
    background: rgba(201,146,46,0.07);
    box-shadow: 0 0 0 1px rgba(201,146,46,0.35), 0 6px 16px rgba(35,26,18,0.1);
  }
  .player.status-busted{ opacity:0.55; }
  .player.status-stayed{ opacity:0.8; }
  .player-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
  }
  .player-head .name{
    font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:6px;
  }
  .dealer-tag{
    font-size:9.5px; color:#fff; background:#2f9d5c; border-radius:5px;
    padding:1px 5px; font-weight:700; letter-spacing:0.03em;
  }
  .status-tag{
    font-size:10.5px; padding:2px 8px; border-radius:999px; font-weight:600; letter-spacing:0.03em;
  }
  .status-tag.active{ background: rgba(47,157,92,0.15); color:#1e7a44; }
  .status-tag.stayed{ background: rgba(79,143,166,0.15); color:#2c6c82; }
  .status-tag.busted{ background: rgba(140,48,56,0.14); color:#a83a43; }
  .player-score{ font-family: Georgia, serif; font-size:19px; color: var(--ink); }
  .player-score small{ font-size:11px; color: var(--ink-faint); font-weight:400; }

  .row-scroll{ overflow-x:auto; padding:4px 2px 2px; }
  .card-row{ display:flex; gap:0; min-height:58px; align-items:center; }
  .mini-card{
    width:38px; height:52px; border-radius:6px; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; margin-right:-10px;
    box-shadow: 0 2px 5px rgba(35,26,18,0.25);
    border:1px solid rgba(35,26,18,0.2);
    position:relative;
  }
  .mini-card.mod{ background: linear-gradient(160deg, var(--gold), var(--gold-2)); color:#fff; font-size:12px; }
  .mini-card.act-freeze{ background: var(--ice); color:#082027; font-size:9px; text-align:center; line-height:1.1; }
  .mini-card.act-flipThree{ background: var(--amber); color:#2a1607; font-size:9px; text-align:center; line-height:1.1; }
  .mini-card.act-secondChance{ background: var(--burgundy); color:#fbe4e6; font-size:8.3px; text-align:center; line-height:1.1; }
  .mini-card.bust{ box-shadow: 0 0 0 2px #d43b45, 0 2px 5px rgba(35,26,18,0.25); }
  .mini-card .glyph{ font-size:15px; margin-bottom:1px; }
  .empty-row{ font-size:12px; color: var(--ink-faint); padding: 12px 4px; }
  .sc-badge{
    margin-left:6px; font-size:10px; background: rgba(140,48,56,0.12); color:#a83a43;
    padding:1px 7px; border-radius:999px; border:1px solid rgba(140,48,56,0.3);
  }

  /* ---------- Action bar ---------- */
  .actionbar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:center;
    padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(255,255,255,0.98) 60%, rgba(255,255,255,0));
    z-index: 40;
  }
  .actionbar-inner{
    width:100%; max-width:760px; display:flex; gap:10px;
  }
  .btn-hit, .btn-stay, .btn-continue{
    flex:1; padding:15px 0; border-radius:14px; border:none; font-weight:700; font-size:15.5px;
    cursor:pointer; box-shadow: var(--shadow);
  }
  .btn-hit{ background: linear-gradient(160deg, var(--green-active), #257a48); color:#fff; }
  .btn-stay{ background: #fff; color:var(--ink); border:1px solid var(--line); }
  .btn-continue{ background: linear-gradient(160deg, var(--gold), var(--gold-2)); color:#fff; width:100%; }

  /* ---------- Modals ---------- */
  .overlay{
    position:fixed; inset:0; background: rgba(35,26,18,0.45);
    display:flex; align-items:flex-end; justify-content:center; z-index:60;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} }
  .sheet{
    width:100%; max-width:520px; background: var(--paper); color: var(--ink);
    border-radius: 22px 22px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 30px rgba(35,26,18,0.25);
    animation: slideUp .28s cubic-bezier(.2,.8,.2,1);
    max-height: 84vh; overflow-y:auto;
  }
  @keyframes slideUp{ from{ transform: translateY(30px); opacity:0;} }
  .sheet h2{
    font-family: Georgia, serif; margin:0 0 4px; font-size:21px;
  }
  .sheet p.sub{ margin:0 0 16px; font-size:13px; color:#6b5f4d; }
  .target-list{ display:flex; flex-direction:column; gap:8px; }
  .target-btn{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 15px; border-radius:12px; border:1.5px solid #e2d8bf;
    background:#fff; font-weight:600; font-size:14.5px; cursor:pointer; color:var(--ink);
  }
  .target-btn:active{ background:#f2ead2; }
  .target-btn .pts{ color:#9a8a68; font-weight:400; font-size:12.5px; }

  .summary-table{ width:100%; border-collapse:collapse; margin-bottom:16px; }
  .summary-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    color:#9a8a68; padding-bottom:8px; font-weight:700;
  }
  .summary-table td{ padding:9px 0; border-top:1px solid #e9e0c8; font-size:14.5px; }
  .summary-table td.num{ text-align:right; font-variant-numeric: tabular-nums; }
  .summary-table tr.winner-row td{ color:#8c6a1f; font-weight:700; }
  .badge-15{ font-size:10.5px; background:#e9d38f; color:#4a3717; padding:1px 6px; border-radius:6px; margin-left:6px; }
  .badge-bust{ font-size:10.5px; background:#f2d0d3; color:#8c3038; padding:1px 6px; border-radius:6px; margin-left:6px; }

  .winner-hero{ text-align:center; margin-bottom: 18px; }
  .winner-hero .crown{ font-size:40px; }
  .winner-hero h2{ margin:6px 0 2px; }
  .winner-hero .score{ font-family:Georgia,serif; font-size:30px; color:#8c6a1f; }

  .flying-card{
    position:fixed; z-index:80; pointer-events:none;
    width:52px; height:73px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:20px;
    box-shadow: 0 8px 20px rgba(35,26,18,0.3);
    transition: transform .46s cubic-bezier(.2,.7,.2,1), opacity .46s ease;
  }

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background: rgba(35,26,18,0.9); border:1px solid rgba(201,146,46,0.4);
    color: #fff; padding:9px 16px; border-radius:999px; font-size:12.5px;
    z-index:90; opacity:0; transition: opacity .3s ease, top .3s ease;
    pointer-events:none; white-space:nowrap; max-width:88vw; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{ opacity:1; top:22px; }

  @media (prefers-reduced-motion: reduce){
    .flying-card, .sheet, .overlay, #deck.pulse{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="flyLayer"></div>
<div id="toast" class="toast"></div>

/* Firebase SDK'sı gstatic.com üzerinden 3 ayrı <script> etiketiyle yükleniyor
   (bkz. <head>). Bir ad-blocker/gizlilik eklentisi bu istekleri engellerse
   ya da o an internet yoksa, "firebase" global değişkeni hiç tanımlanmaz ve
   firebase.initializeApp(...) satırı "firebase is not defined" hatasıyla
   patlayıp SAYFANIN GERİ KALAN TÜM KODUNU (yerel/local oyunu bile) çalışmaz
   hale getirirdi. Aşağıdaki koruma bunu engeller: SDK yüklenemediyse online
   özellikler düzgün bir uyarıyla devre dışı kalır, ama tek cihazda oynama
   etkilenmez.*/
let firebaseReady = false;
let auth = null;
let db = null;
if (typeof firebase !== 'undefined') {
  try {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.database();
    firebaseReady = true;
  } catch (err) {
    console.error('Firebase başlatılamadı', err);
  }
} else {
  console.error('Firebase SDK yüklenemedi (gstatic.com istekleri engellenmiş/başarısız olmuş olabilir; ad-blocker veya internet bağlantısını kontrol edin).');
}

let myUid = null;
// authReady artık gerçekten myUid atanana kadar bekler; eskiden
// signInAnonymously() Promise'i ile onAuthStateChanged callback'i arasında
// bir yarış (race condition) vardı ve bazı durumlarda "Oda Oluştur"a
// tıklandığında myUid henüz set edilmemiş oluyordu, buton da sessizce
// hiçbir şey yapmıyordu. Firebase hiç yüklenmediyse (firebaseReady=false)
// authReady sonsuza dek beklemek yerine hemen çözülür; online butonları
// zaten firebaseReady kontrolüyle ayrıca engellenir.
const authReady = firebaseReady
  ? new Promise((resolve) => {
      auth.onAuthStateChanged(u => {
        if (u) { myUid = u.uid; resolve(u); }
      });
    })
  : Promise.resolve(null);
if (firebaseReady) {
  auth.signInAnonymously().catch(err => {
    console.error('Giriş hatası', err);
    showToast('Giriş yapılamadı: ' + (err && err.message ? err.message : err));
  });
}

function generateRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // karışıklık yaratan 0/O, 1/I gibi karakterler çıkarıldı
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

/* Firebase'e giden verinin fonksiyon/undefined içermeyen düz (plain) bir
   kopyasını çıkarır; JSON.stringify zaten fonksiyon değerli alanları
   (ör. Game.rng) otomatik olarak atar. */
function serializeGame(g) {
  return JSON.parse(JSON.stringify(g));
}

/* Uzaktaki (host olmayan) istemcilerde gelen düz veriyi, render()
   fonksiyonlarının ihtiyaç duyduğu birkaç salt-okunur metotla donatır. */
function hydrateGame(gs) {
  if (!gs) return null;
  const g = JSON.parse(JSON.stringify(gs));
  g.activePlayers = function () { return this.players.filter(p => p.status === 'active'); };
  g.freezeTargets = function (actingIdx) { return this.activePlayers().filter(p => p.idx !== actingIdx); };
  return g;
}

/* Host sayfayı yenilerse (veya oyun sürerken tekrar bağlanırsa), Firebase'deki
   son veriden gerçek, tam yetkili bir Game örneği yeniden kurulur (sadece
   görüntüleme metotları değil, playerHit/chooseTarget gibi tüm oyun
   mantığıyla birlikte) — böylece host oyunu kaldığı yerden yönetmeye devam
   edebilir. */
function reconstructHostGame(gs) {
  const g = Object.assign(Object.create(Game.prototype), JSON.parse(JSON.stringify(gs)));
  g.rng = Math.random;
  return g;
}

function pushGameState() {
  if (!state.online || !state.online.isHost || !state.game) return;
  db.ref(`rooms/${state.online.code}/gameState`).set(serializeGame(state.game)).catch(e => console.error(e));
}

function setupOnDisconnect(code, uid, path) {
  if (path === 'players') {
    db.ref(`rooms/${code}/players/${uid}/connected`).onDisconnect().set(false);
  } else {
    db.ref(`rooms/${code}/spectators/${uid}`).onDisconnect().remove();
  }
}

async function createRoom(maxPlayers, name) {
  if (!firebaseReady) { showToast('Online mod kullanılamıyor: Firebase yüklenemedi. Ad-blocker/eklenti veya internet bağlantısını kontrol edip sayfayı yenileyin.'); return; }
  await authReady;
  if (!myUid) { showToast('Giriş yapılamadı, tekrar deneyin'); return; }
  const code = generateRoomCode();
  const roomRef = db.ref('rooms/' + code);
  try {
    await roomRef.set({
      hostId: myUid,
      maxPlayers,
      status: 'waiting',
      players: { [myUid]: { name: (name || 'Host').trim() || 'Host', role: 'host', joinedAt: Date.now(), connected: true } },
      spectators: {},
      createdAt: Date.now(),
      gameState: null,
    });
  } catch (err) {
    // Önceden burada hata sessizce yutuluyordu (yakalanmayan Promise reddi);
    // "Oda Oluştur"a basınca hiçbir şey olmuyormuş gibi görünmesinin sebebi
    // muhtemelen buydu (ör. yanlış databaseURL veya izin/rules hatası).
    console.error('Oda oluşturulamadı', err);
    showToast('Oda oluşturulamadı: ' + (err && err.message ? err.message : err));
    return;
  }
  setupOnDisconnect(code, myUid, 'players');
  attachRoomListener(code, true);
}

async function joinRoom(rawCode, name) {
  if (!firebaseReady) { showToast('Online mod kullanılamıyor: Firebase yüklenemedi. Ad-blocker/eklenti veya internet bağlantısını kontrol edip sayfayı yenileyin.'); return; }
  await authReady;
  if (!myUid) { showToast('Giriş yapılamadı, tekrar deneyin'); return; }
  const code = (rawCode || '').trim().toUpperCase();
  if (!code) { showToast('Önce bir oda kodu girin'); return; }
  const roomRef = db.ref('rooms/' + code);
  let snap;
  try {
    snap = await roomRef.once('value');
  } catch (err) {
    console.error('Odaya bağlanılamadı', err);
    showToast('Odaya bağlanılamadı: ' + (err && err.message ? err.message : err));
    return;
  }
  if (!snap.exists()) { showToast('Böyle bir oda bulunamadı'); return; }
  const room = snap.val();
  const playerCount = room.players ? Object.keys(room.players).length : 0;
  const isReturningPlayer = !!(room.players && room.players[myUid]);
  const asPlayer = isReturningPlayer || (room.status === 'waiting' && playerCount < room.maxPlayers);
  const path = asPlayer ? 'players' : 'spectators';
  const data = { name: (name || 'Oyuncu').trim() || 'Oyuncu', joinedAt: (room.players && room.players[myUid] && room.players[myUid].joinedAt) || Date.now(), connected: true };
  if (asPlayer) data.role = (myUid === room.hostId) ? 'host' : 'player';
  try {
    await roomRef.child(path + '/' + myUid).set(data);
  } catch (err) {
    console.error('Odaya katılınamadı', err);
    showToast('Odaya katılınamadı: ' + (err && err.message ? err.message : err));
    return;
  }
  setupOnDisconnect(code, myUid, path);
  attachRoomListener(code, myUid === room.hostId);
  if (!asPlayer) showToast(room.status === 'playing' ? 'Oyun başlamış, izleyici olarak katıldınız' : 'Oda dolu, izleyici olarak katıldınız');
}

function sendAction(action, extra) {
  if (!state.online) return;
  const ref = db.ref(`rooms/${state.online.code}/actions`).push();
  ref.set(Object.assign({ uid: myUid, action, ts: Date.now() }, extra || {})).catch(e => console.error(e));
}

function attachActionsListener(code) {
  const ref = db.ref(`rooms/${code}/actions`);
  const handler = snap => {
    const act = snap.val();
    ref.child(snap.key).remove();
    handleRemoteAction(act);
  };
  ref.on('child_added', handler);
  if (state.online) state.online.actionsUnsub = () => ref.off('child_added', handler);
}

function handleRemoteAction(act) {
  const g = state.game;
  if (!g || !act) return;
  if (act.action === 'hit') {
    if (g.phase !== 'turn') return;
    if (g.players[g.order[g.turnPos]].uid !== act.uid) return;
    onHit();
  } else if (act.action === 'stay') {
    if (g.phase !== 'turn') return;
    if (g.players[g.order[g.turnPos]].uid !== act.uid) return;
    onStay();
  } else if (act.action === 'chooseTarget') {
    if (g.phase !== 'chooseTarget' || !g.pending) return;
    if (g.players[g.pending.actingIdx].uid !== act.uid) return;
    onChooseTarget(act.targetIdx);
  } else if (act.action === 'flip3-continue') {
    if (g.phase !== 'flip3draw' || g.flip3Stack.length === 0) return;
    const top = g.flip3Stack[g.flip3Stack.length - 1];
    if (g.players[top.targetIdx].uid !== act.uid) return;
    onFlip3Continue();
  }
}

function attachRoomListener(code, isHost) {
  if (state.online && state.online.unsub) state.online.unsub();
  if (state.online && state.online.actionsUnsub) state.online.actionsUnsub();
  state.online = { code, isHost, unsub: null, actionsUnsub: null, players: {}, spectators: {}, maxPlayers: 4, status: 'waiting', hostId: null };
  const roomRef = db.ref('rooms/' + code);
  const handler = snap => {
    const room = snap.val();
    if (!room) { showToast('Oda kapatıldı'); state.online = null; state.screen = 'home'; render(); return; }
    Object.assign(state.online, {
      maxPlayers: room.maxPlayers, hostId: room.hostId, status: room.status,
      players: room.players || {}, spectators: room.spectators || {},
    });
    if (room.status === 'waiting') {
      state.game = null;
      state.screen = 'lobby';
      render();
    } else if (room.status === 'playing') {
      if (!isHost) {
        // Misafir istemciler oyunu tamamen host'un yayınladığı veriden izler.
        state.game = hydrateGame(room.gameState);
        state.screen = 'game';
        render();
      } else if (state.screen !== 'game' && room.gameState) {
        // Bu dal normalde çalışmaz (host oyunu zaten kendi başlatır); sadece
        // host sayfayı 'playing' durumundaki bir odaya sonradan bağlanırsa/
        // yenilerse devreye girer. Kendi yazdığı gameState güncellemeleri
        // yüzünden gereksiz yere tekrar render+push döngüsüne girmemek için
        // ekran zaten 'game' ise burada hiçbir şey yapılmaz.
        state.game = reconstructHostGame(room.gameState);
        state.screen = 'game';
        render();
        if (state.game.phase === 'dealing') runDealingSequence();
      }
    }
  };
  roomRef.on('value', handler);
  state.online.unsub = () => roomRef.off('value', handler);
  if (isHost) attachActionsListener(code);
}

function leaveRoom() {
  if (!state.online) return;
  const { code, isHost, unsub, actionsUnsub } = state.online;
  if (unsub) unsub();
  if (actionsUnsub) actionsUnsub();
  if (isHost) {
    db.ref('rooms/' + code).remove().catch(() => {});
  } else {
    db.ref(`rooms/${code}/players/${myUid}`).remove().catch(() => {});
    db.ref(`rooms/${code}/spectators/${myUid}`).remove().catch(() => {});
  }
  state.online = null;
  state.game = null;
  state.screen = 'home';
  render();
}

async function startOnlineGame() {
  const online = state.online;
  if (!online || !online.isHost) return;
  const entries = Object.entries(online.players).sort((a, b) => a[1].joinedAt - b[1].joinedAt);
  if (entries.length < MIN_PLAYERS) { showToast(`En az ${MIN_PLAYERS} oyuncu gerekli`); return; }
  const names = entries.map(([, p]) => p.name);
  const uids = entries.map(([uid]) => uid);
  state.game = new Game(names, Math.random);
  state.game.players.forEach((p, i) => { p.uid = uids[i]; });
  await db.ref(`rooms/${online.code}/status`).set('playing');
  state.game.startRound();
  state.screen = 'game';
  render();
  await runDealingSequence();
}

function resetOnlineRoomForNewGame() {
  const online = state.online;
  if (!online || !online.isHost) return;
  db.ref(`rooms/${online.code}`).update({ status: 'waiting', gameState: null }).catch(() => {});
  state.game = null;
  state.screen = 'lobby';
  render();
}

/* ---- Sıra kontrolü: sırası gelmemiş oyuncu bir aksiyona tıklarsa
   ekranın üstünde belirip kaybolan bir uyarı (toast) gösterilir. ---- */
function currentActorUid() {
  const g = state.game;
  if (!g) return null;
  if (g.phase === 'turn') return g.players[g.order[g.turnPos]] && g.players[g.order[g.turnPos]].uid;
  if (g.phase === 'chooseTarget' && g.pending) return g.players[g.pending.actingIdx] && g.players[g.pending.actingIdx].uid;
  if (g.phase === 'flip3draw' && g.flip3Stack.length) {
    const top = g.flip3Stack[g.flip3Stack.length - 1];
    return g.players[top.targetIdx] && g.players[top.targetIdx].uid;
  }
  return null;
}
function isMyTurnNow() { return !state.online || currentActorUid() === myUid; }

/* =========================================================
   ENGINE  (deck, rules, state machine)
========================================================= */
function buildDeck() {
  const cards = [];
  let uid = 0;
  cards.push({ id: uid++, type: 'number', value: 0 });
  for (let n = 1; n <= 12; n++) {
    for (let c = 0; c < n; c++) cards.push({ id: uid++, type: 'number', value: n });
  }
  [2, 4, 6, 8, 10].forEach(v => cards.push({ id: uid++, type: 'modifier', kind: 'add', value: v }));
  cards.push({ id: uid++, type: 'modifier', kind: 'mult', value: 2 });
  for (let c = 0; c < 3; c++) {
    cards.push({ id: uid++, type: 'action', kind: 'freeze' });
    cards.push({ id: uid++, type: 'action', kind: 'flipThree' });
    cards.push({ id: uid++, type: 'action', kind: 'secondChance' });
  }
  return cards;
}
function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/* Deste, gerçek bir kart destesi gibi başında bir kez tamamen rastgele
   karıştırılır (Fisher-Yates) ve draw() ile sondan (pop) çekilir; bu da
   fiziksel olarak "karıştır, en üstten çek" mantığına karşılık gelir.
   Çekilecek kartların sırası üzerinde başkaca hiçbir müdahale/garanti
   yapılmaz (ör. art arda farklı/aynı sayı gelmesini engelleme gibi),
   böylece hangi kartın ne zaman geleceği tamamen şansa bağlıdır. */
function makePlayers(names) {
  return names.map((name, i) => ({
    idx: i, name, total: 0, numbers: [], cards: [], modifiers: [],
    secondChance: false, status: 'active', frozen: false, roundScore: 0,
  }));
}
function roundScore(p) {
  if (p.status === 'busted') return 0;
  let sum = p.numbers.reduce((a, b) => a + b, 0);
  const mult = p.modifiers.some(m => m.kind === 'mult') ? 2 : 1;
  sum *= mult;
  sum += p.modifiers.filter(m => m.kind === 'add').reduce((a, m) => a + m.value, 0);
  if (p.numbers.length >= 7) sum += 15;
  return sum;
}
class Game {
  constructor(names, rng) {
    this.rng = rng || Math.random;
    this.players = makePlayers(names);
    this.dealerIndex = 0;
    this.round = 0;
    this.winner = null;
    this.log = [];
  }
  seatOrder() {
    const n = this.players.length, order = [];
    for (let i = 1; i <= n; i++) order.push((this.dealerIndex + i) % n);
    return order;
  }
  startRound() {
    this.round++;
    this.deck = shuffle(buildDeck(), this.rng);
    this.discard = [];
    this.players.forEach(p => {
      p.numbers = []; p.cards = []; p.modifiers = []; p.secondChance = false;
      p.status = 'active'; p.frozen = false; p.roundScore = 0;
    });
    this.order = this.seatOrder();
    this.pending = null;
    this.flip3Stack = [];
    this.flip3RootActing = null;
    this.flip3RootCtx = null;
    this.phase = 'dealing';
    this.dealPos = 0;
    this.roundWinnerBonusFor = null;
  }
  draw() {
    if (this.deck.length === 0) { this.deck = shuffle(this.discard, this.rng); this.discard = []; }
    return this.deck.pop();
  }
  dealStep() {
    if (this.phase !== 'dealing') return;
    if (this.dealPos >= this.order.length) { this.phase = 'turn'; this._advanceTurn(-1); return; }
    const idx = this.order[this.dealPos];
    const card = this.draw();
    const res = this._applyCard(idx, card);
    this._handleResult(res, idx, { mode: 'dealing' });
  }
  _applyCard(idx, card) {
    const p = this.players[idx];
    p.cards.push(card);
    if (card.type === 'number') {
      if (p.numbers.includes(card.value)) {
        if (p.secondChance) {
          p.secondChance = false; this.discard.push(card);
          // Kullanılan ikinci şans kartı, oyuncunun destesinden kaldırılır.
          const scIdx = p.cards.findIndex(c => c.type === 'action' && c.kind === 'secondChance');
          if (scIdx !== -1) { this.discard.push(p.cards[scIdx]); p.cards.splice(scIdx, 1); }
          this.log.push(`${p.name} ikinci şansını kullandı.`);
          return { result: 'saved' };
        }
        p.status = 'busted';
        this.log.push(`${p.name} elendi (${card.value} tekrar geldi).`);
        return { result: 'bust' };
      }
      p.numbers.push(card.value);
      if (p.numbers.length >= 7) { this.log.push(`${p.name} 7 farklı kart topladı! Flip 7!`); return { result: 'flip7' }; }
      return { result: 'ok' };
    }
    if (card.type === 'modifier') { p.modifiers.push(card); return { result: 'ok' }; }
    if (card.kind === 'secondChance') {
      if (p.secondChance) { this.discard.push(card); return { result: 'ok' }; }
      p.secondChance = true;
      this.log.push(`${p.name} ikinci şans kartı aldı.`);
      return { result: 'ok' };
    }
    return { result: 'action', card };
  }
  activePlayers() { return this.players.filter(p => p.status === 'active'); }
  /* Dondur kartı için geçerli hedefler: kartı çeken oyuncu hariç, hâlâ aktif olan oyuncular. */
  freezeTargets(actingIdx) { return this.activePlayers().filter(p => p.idx !== actingIdx); }
  _handleResult(res, actingIdx, ctx) {
    if (res.result === 'flip7') { this._endRound(actingIdx); return; }
    if (res.result === 'action') {
      if (res.card.kind === 'freeze' && this.freezeTargets(actingIdx).length === 0) {
        // Dondurulacak başka aktif oyuncu yok, kart boşa gider.
        const actor = this.players[actingIdx];
        const ci = actor.cards.indexOf(res.card);
        if (ci !== -1) { actor.cards.splice(ci, 1); this.discard.push(res.card); }
        this.log.push(`${actor.name} dondur kartını kullanacak başka aktif oyuncu yok.`);
        this._resumeAfterAction(actingIdx, ctx);
        return;
      }
      this.pending = { actionType: res.card.kind, actingIdx, ctx, card: res.card };
      this.phase = 'chooseTarget';
      return;
    }
    if (ctx.mode === 'dealing') {
      this.dealPos++;
      if (this.dealPos >= this.order.length) { this.phase = 'turn'; this._advanceTurn(-1); }
    } else if (ctx.mode === 'flip3') {
      this._continueFlip3();
    } else {
      this._checkRoundEndOrAdvance();
    }
  }
  chooseTarget(targetIdx) {
    if (this.phase !== 'chooseTarget' || !this.pending) return;
    const { actionType, actingIdx, ctx, card } = this.pending;
    if (actionType === 'freeze' && targetIdx === actingIdx) return; // dondur kendine kullanılamaz
    const target = this.players[targetIdx];
    if (actionType === 'freeze') {
      target.status = 'stayed'; target.frozen = true;
      this.log.push(`${target.name} donduruldu ve puanını bankaya yatırdı.`);
      // Kullanılan dondur kartı, çeken oyuncunun destesinden kaldırılır.
      const actor = this.players[actingIdx];
      if (card) {
        const ci = actor.cards.indexOf(card);
        if (ci !== -1) { actor.cards.splice(ci, 1); this.discard.push(card); }
      }
      this.pending = null;
      this._resumeAfterAction(actingIdx, ctx);
    } else if (actionType === 'flipThree') {
      const wasEmpty = this.flip3Stack.length === 0;
      if (wasEmpty) { this.flip3RootActing = actingIdx; this.flip3RootCtx = ctx; }
      this.log.push(`${target.name} için Üç Çek başladı.`);
      this.pending = null;
      this.flip3Stack.push({ targetIdx, remaining: 3 });
      this.phase = 'flip3draw';
    }
  }
  _resumeAfterAction(actingIdx, ctx) {
    if (ctx.mode === 'dealing') {
      this.dealPos++;
      if (this.dealPos >= this.order.length) { this.phase = 'turn'; this._advanceTurn(-1); }
      else this.phase = 'dealing';
    } else if (ctx.mode === 'flip3') {
      this._continueFlip3();
    } else {
      this._checkRoundEndOrAdvance();
    }
  }
  drawFlip3Card() {
    if (this.phase !== 'flip3draw' || this.flip3Stack.length === 0) return;
    const top = this.flip3Stack[this.flip3Stack.length - 1];
    const target = this.players[top.targetIdx];
    if (target.status !== 'active') { top.remaining = 0; this._continueFlip3(); return; }
    const card = this.draw();
    const res = this._applyCard(top.targetIdx, card);
    top.remaining--;
    this._handleResult(res, top.targetIdx, { mode: 'flip3' });
  }
  _continueFlip3() {
    if (this.flip3Stack.length === 0) return;
    const top = this.flip3Stack[this.flip3Stack.length - 1];
    const target = this.players[top.targetIdx];
    if (top.remaining <= 0 || target.status !== 'active') {
      this.flip3Stack.pop();
      if (this.flip3Stack.length > 0) { this.phase = 'flip3draw'; }
      else {
        const actingIdx = this.flip3RootActing, ctx = this.flip3RootCtx;
        this.flip3RootActing = null; this.flip3RootCtx = null;
        this._resumeAfterAction(actingIdx, ctx);
      }
      return;
    }
    this.phase = 'flip3draw';
  }
  playerHit() {
    if (this.phase !== 'turn') return;
    const idx = this.order[this.turnPos];
    const card = this.draw();
    const res = this._applyCard(idx, card);
    this._handleResult(res, idx, { mode: 'turn' });
  }
  playerStay() {
    if (this.phase !== 'turn') return;
    const idx = this.order[this.turnPos];
    this.players[idx].status = 'stayed';
    this.log.push(`${this.players[idx].name} pas geçti.`);
    this._checkRoundEndOrAdvance();
  }
  _checkRoundEndOrAdvance() {
    if (this.activePlayers().length === 0) { this._endRound(null); return; }
    this._advanceTurn(this.turnPos);
  }
  _advanceTurn(fromPos) {
    const n = this.order.length;
    for (let k = 1; k <= n; k++) {
      const pos = (fromPos + k) % n;
      if (this.players[this.order[pos]].status === 'active') { this.turnPos = pos; this.phase = 'turn'; return; }
    }
    this._endRound(null);
  }
  _endRound(flip7WinnerIdx) {
    this.phase = 'roundSummary';
    this.roundWinnerBonusFor = flip7WinnerIdx;
    this.players.forEach(p => {
      if (p.status === 'active') p.status = 'stayed';
      p.roundScore = roundScore(p);
      p.total += p.roundScore;
    });
    const champ = this.players.reduce((a, b) => (b.total > a.total ? b : a));
    if (champ.total >= 200) { this.winner = champ; this.phase = 'gameOver'; }
  }
  nextRound() {
    if (this.phase !== 'roundSummary') return;
    this.dealerIndex = (this.dealerIndex + 1) % this.players.length;
    this.startRound();
  }
}

/* ---------- card visuals ---------- */
function cardFaceHTML(card) {
  if (card.type === 'number') return `<span>${card.value}</span>`;
  if (card.type === 'modifier') return card.kind === 'mult' ? `<span>×2</span>` : `<span>+${card.value}</span>`;
  if (card.kind === 'freeze') return `<span class="glyph">❄</span><span>DONDUR</span>`;
  if (card.kind === 'flipThree') return `<span class="glyph">3</span><span>ÜÇ ÇEK</span>`;
  if (card.kind === 'secondChance') return `<span class="glyph">🛡</span><span>İKİNCİ<br>ŞANS</span>`;
  return '';
}
function cardClass(card) {
  if (card.type === 'number') return 'number';
  if (card.type === 'modifier') return 'mod';
  return 'act-' + card.kind;
}
/* Her sayı kartının (0-12) kendine ait bir rengi var, böylece elindeki kartlar

  1:  { bg: '#f5e56b', fg: '#3a2f00' },
  2:  { bg: '#f2b53c', fg: '#3a2400' },

}

/* ---------- game screen ---------- */
function statusLabel(p) {
  if (p.status === 'busted') return 'Elendi';
  if (p.status === 'stayed') return p.frozen ? 'Donduruldu' : 'Pas';
  return 'Aktif';
}
function playerCardsHTML(p) {
  if (p.cards.length === 0) return `<div class="empty-row">Henüz kart yok</div>`;
  const lastIsBustCause = p.status === 'busted';
  return p.cards.map((c, i) => {
    const isLast = i === p.cards.length - 1;
    const bustCls = (lastIsBustCause && isLast && c.type === 'number') ? ' bust' : '';
    const colorStyle = c.type === 'number' ? (() => {
      const { bg, fg } = cardColor(c);
      return `background:${bg}; color:${fg};`;
    })() : '';
    return `<div class="mini-card ${cardClass(c)}${bustCls}" style="transform:rotate(${(i % 5 - 2) * 3}deg); z-index:${i}; ${colorStyle}">${cardFaceHTML(c)}</div>`;
  }).join('');
}
function renderGame() {
  const g = state.game;
  const inTurn = g.phase === 'turn';
  const currentIdx = inTurn ? g.order[g.turnPos] : (g.phase === 'flip3draw' ? g.flip3Stack[g.flip3Stack.length - 1].targetIdx : null);

  const playersHTML = g.players.map(p => {
    const isCurrent = currentIdx === p.idx;
    const isDealer = g.dealerIndex === p.idx;
    const onlineInfo = state.online && p.uid ? state.online.players[p.uid] : null;
    const disconnected = onlineInfo && onlineInfo.connected === false;
    return `
      <div class="player status-${p.status} ${isCurrent ? 'is-turn' : ''}" data-idx="${p.idx}">
        <div class="player-head">
          <div class="name">${escapeHtml(p.name)} ${isDealer ? '<span class="dealer-tag">DAĞITICI</span>' : ''}
            ${p.secondChance ? '<span class="sc-badge">🛡 2. Şans</span>' : ''}

          <span class="status-tag ${p.status}">${statusLabel(p)}</span>
        </div>

        <div class="player-score"><small>Bu turda</small> ${roundScore(p)} &nbsp;·&nbsp; <small>Toplam</small> ${p.total}</div>

  let banner = '';
  if (g.phase === 'dealing') banner = `<div class="turn-banner"><div class="who">Kartlar dağıtılıyor…</div></div>`;
  else if (g.phase === 'turn') banner = `<div class="turn-banner"><div class="who">${escapeHtml(g.players[currentIdx].name)} sırası${state.online && g.players[currentIdx].uid === myUid ? ' · sıra sende' : ''}</div><div class="hint">Çek ya da pas geç</div></div>`;

  if (g.phase === 'chooseTarget' && g.pending) {
    const isFreeze = g.pending.actionType === 'freeze';
    const actives = isFreeze ? g.freezeTargets(g.pending.actingIdx) : g.activePlayers();
    const title = isFreeze ? 'Dondur' : 'Üç Çek';
    const sub = isFreeze
      ? 'Rakiplerden biri anında puanını bankaya yatırıp turdan çıkacak.'

    const overlay = document.createElement('div');
    overlay.className = 'overlay';

      <h2>${title} kartı çekildi</h2>
      <p class="sub">${sub}</p>
      <div class="target-list">${list}</div>

    document.body.appendChild(overlay);
    // auto-resolve if only one active player
    if (actives.length === 1) {
      setTimeout(() => onChooseTarget(actives[0].idx), 350);

  }

  if (g.phase === 'roundSummary') {
    const rows = g.players.slice().sort((a, b) => b.total - a.total).map(p => `
      <tr class="${g.winner && g.winner.idx === p.idx ? 'winner-row' : ''}">
        <td>${escapeHtml(p.name)}
          ${g.roundWinnerBonusFor === p.idx ? '<span class="badge-15">+15 Flip 7</span>' : ''}
          ${p.status === 'busted' ? '<span class="badge-bust">Elendi</span>' : ''}
        </td>
        <td class="num">${p.roundScore}</td>
        <td class="num">${p.total}</td>
      </tr>
    `).join('');
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="sheet">
      <h2>Tur ${g.round} bitti</h2>
      <p class="sub">Puanlar bankaya yatırıldı</p>
      <table class="summary-table">
        <tr><th>Oyuncu</th><th style="text-align:right">Bu tur</th><th style="text-align:right">Toplam</th></tr>
        ${rows}
      </table>
      <button class="btn-primary" data-action="next-round">Sıradaki Tur</button>
    </div>`;
    document.body.appendChild(overlay);
    return;
  }

  if (g.phase === 'gameOver') {
    const sorted = g.players.slice().sort((a, b) => b.total - a.total);
    const rows = sorted.map(p => `
      <tr class="${p.idx === g.winner.idx ? 'winner-row' : ''}">
        <td>${escapeHtml(p.name)}</td><td class="num">${p.total}</td>
      </tr>`).join('');
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="sheet">
      <div class="winner-hero">
        <div class="crown">🏆</div>
        <h2>${escapeHtml(g.winner.name)} kazandı!</h2>
        <div class="score">${g.winner.total} puan</div>
      </div>
      <table class="summary-table">
        <tr><th>Oyuncu</th><th style="text-align:right">Toplam</th></tr>
        ${rows}
      </table>
      <button class="btn-primary" data-action="new-game">Yeni Oyun</button>
    </div>`;
    document.body.appendChild(overlay);
    return;
  }
}

function render() {
  if (state.screen !== 'game') {
    // Oyun ekranına ait overlay/aksiyon çubuğu kalmışsa temizle (savunma amaçlı).
    const oldOverlay = document.querySelector('.overlay');
    if (oldOverlay) oldOverlay.remove();
    const oldBar = document.querySelector('.actionbar');
    if (oldBar) oldBar.remove();
  }
  if (state.screen === 'home') renderHome();
  else if (state.screen === 'setup') renderSetup();
  else if (state.screen === 'online-create') renderOnlineCreate();
  else if (state.screen === 'online-join') renderOnlineJoin();
  else if (state.screen === 'lobby') renderLobby();
  else if (state.screen === 'game') {
    if (!state.game) {
      app.innerHTML = `
        <div class="brand brand-compact"><img class="logo-img logo-img-sm" src="${LOGO_SRC}" alt="Flip 7"></div>
        <div class="setup-card"><p class="hint" style="text-align:center;">Oyun yükleniyor…</p></div>`;
    } else {
      renderGame();
    }
  }
  // Host, her ekran güncellemesinde geçerli oyun durumunu odadaki diğer
  // istemcilere (Realtime Database üzerinden) yayınlar.
  if (state.online && state.online.isHost && state.game) pushGameState();
}

/* =========================================================
   ANIMATION: flying card from deck to a player's row
========================================================= */
async function flyCardToPlayer(playerIdx, card) {
  const deckEl = document.getElementById('deck');
  const rowEl = document.querySelector(`[data-row-idx="${playerIdx}"]`);
  if (!deckEl || !rowEl) return;
  deckEl.classList.remove('pulse'); void deckEl.offsetWidth; deckEl.classList.add('pulse');

  const fromRect = deckEl.getBoundingClientRect();
  const rowRect = rowEl.getBoundingClientRect();
  const toX = Math.min(rowRect.left + rowRect.width - 20, rowRect.left + 40);
  const toY = rowRect.top + rowRect.height / 2 - 36;

  const { bg, fg } = cardColor(card);
  const fly = document.createElement('div');
  fly.className = 'flying-card';
  fly.style.left = (fromRect.left + fromRect.width / 2 - 26) + 'px';
  fly.style.top = (fromRect.top + fromRect.height / 2 - 36) + 'px';
  fly.style.background = bg;
  fly.style.color = fg;
  fly.style.opacity = '0';
  fly.innerHTML = cardFaceHTML(card);
  flyLayer.appendChild(fly);

  await sleep(20);
  fly.style.opacity = '1';
  fly.style.transform = `translate(${toX - (fromRect.left + fromRect.width / 2 - 26)}px, ${toY - (fromRect.top + fromRect.height / 2 - 36)}px) rotate(${(Math.random() * 16 - 8).toFixed(0)}deg)`;

  await new Promise(res => {
    let done = false;
    const finish = () => { if (done) return; done = true; res(); };
    fly.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 560);
  });
  fly.style.opacity = '0';
  setTimeout(() => fly.remove(), 220);
}

/* =========================================================
   FLOW CONTROL
========================================================= */
async function runDealingSequence() {
  const g = state.game;
  state.busy = true;
  while (g.phase === 'dealing') {
    const idx = g.order[g.dealPos];
    if (idx === undefined) break;
    g.dealStep();
    const p = g.players[idx];
    const card = p.cards[p.cards.length - 1];
    if (card) await flyCardToPlayer(idx, card);
    render();
    if (g.phase === 'chooseTarget' || g.phase === 'flip3draw') { state.busy = false; return; }
    await sleep(160);
  }
  state.busy = false;
  render();
}

async function onHit() {
  if (state.busy) return;
  const g = state.game;
  if (g.phase !== 'turn') return;
  state.busy = true;
  const idx = g.order[g.turnPos];
  g.playerHit();
  const p = g.players[idx];
  const card = p.cards[p.cards.length - 1];
  if (card) await flyCardToPlayer(idx, card);
  state.busy = false;
  render();
}

function onStay() {
  if (state.busy) return;
  const g = state.game;
  if (g.phase !== 'turn') return;
  g.playerStay();
  render();
}

async function onChooseTarget(targetIdx) {
  if (state.busy) return;
  const g = state.game;
  if (g.phase !== 'chooseTarget') return;
  state.busy = true;
  g.chooseTarget(targetIdx);
  state.busy = false;
  if (g.phase === 'dealing') { render(); await runDealingSequence(); }
  else render();
}

async function onFlip3Continue() {
  if (state.busy) return;
  const g = state.game;
  if (g.phase !== 'flip3draw') return;
  state.busy = true;
  const top = g.flip3Stack[g.flip3Stack.length - 1];
  const targetIdx = top.targetIdx;
  g.drawFlip3Card();
  const p = g.players[targetIdx];
  const card = p.cards[p.cards.length - 1];
  if (card) await flyCardToPlayer(targetIdx, card);
  state.busy = false;
  if (g.phase === 'dealing') { render(); await runDealingSequence(); }
  else render();
}

function onNextRound() {
  const g = state.game;
  g.nextRound();
  render();
  runDealingSequence();
}

function startGame() {
  const names = state.names.slice(0, state.count).map((n, i) => (n && n.trim()) ? n.trim() : `Oyuncu ${i + 1}`);
  state.game = new Game(names, Math.random);
  state.game.startRound();
  state.screen = 'game';
  render();
  runDealingSequence();
}

function newGame() {
  // Skor tablosu (overlay) ve alt aksiyon çubuğu, oyun ekranına ait DOM
  // elemanları olduğundan setup ekranına dönmeden önce mutlaka temizlenmeli;
  // aksi halde eski overlay ekranda asılı kalıp yeni oyunu başlatma akışını bozuyordu.
  const oldOverlay = document.querySelector('.overlay');
  if (oldOverlay) oldOverlay.remove();
  const oldBar = document.querySelector('.actionbar');
  if (oldBar) oldBar.remove();
  state.busy = false;
  state.screen = 'setup';
  state.game = null;
  render();
}

/* ---------------------------------------------------------
   Online-uyumlu aksiyon köprüsü: sıra kimdeyse sadece o kişi
   hamle yapabilir; sırası gelmemiş biri tıklarsa "sıra sizde
   değil" uyarısı belirip kısa süre sonra kaybolur. Host kendi
   sırasında doğrudan oynar; diğer oyuncuların hamleleri host'a
   Firebase üzerinden bir "action" isteği olarak iletilir ve
   sadece host bunları oyuna uygular.
--------------------------------------------------------- */
function guardedAction(actionName, extra, localFn) {
  if (state.online) {
    if (!isMyTurnNow()) { showToast('Sıra sizde değil'); return; }
    if (!state.online.isHost) { sendAction(actionName, extra); return; }
  }
  localFn();
}
function handleHitClick() { guardedAction('hit', null, onHit); }
function handleStayClick() { guardedAction('stay', null, onStay); }
function handleFlip3ContinueClick() { guardedAction('flip3-continue', null, onFlip3Continue); }
function handleChooseTargetClick(targetIdx) { guardedAction('chooseTarget', { targetIdx }, () => onChooseTarget(targetIdx)); }
function handleNextRoundClick() {
  if (state.online && !state.online.isHost) { showToast('Turu sadece oda sahibi ilerletebilir'); return; }
  onNextRound();
}
function handleNewGameClick() {
  if (state.online) {
    if (!state.online.isHost) { showToast('Yeni oyunu sadece oda sahibi başlatabilir'); return; }
    resetOnlineRoomForNewGame();
    return;
  }
  newGame();
}

/* =========================================================
   EVENTS
========================================================= */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'inc-players') { if (state.count < MAX_PLAYERS) state.count++; render(); }
  else if (action === 'dec-players') { if (state.count > MIN_PLAYERS) state.count--; render(); }
  else if (action === 'start-game') startGame();
  else if (action === 'hit') handleHitClick();
  else if (action === 'stay') handleStayClick();
  else if (action === 'flip3-continue') handleFlip3ContinueClick();
  else if (action === 'choose-target') handleChooseTargetClick(parseInt(btn.dataset.targetIdx, 10));
  else if (action === 'next-round') handleNextRoundClick();
  else if (action === 'new-game') handleNewGameClick();
  else if (action === 'go-home') { state.screen = 'home'; render(); }
  else if (action === 'go-setup') { state.screen = 'setup'; render(); }
  else if (action === 'go-online-create') { state.screen = 'online-create'; render(); }
  else if (action === 'go-online-join') { state.screen = 'online-join'; render(); }
  else if (action === 'inc-online-count') { if (state.form.onlineCount < MAX_PLAYERS) state.form.onlineCount++; render(); }
  else if (action === 'dec-online-count') { if (state.form.onlineCount > MIN_PLAYERS) state.form.onlineCount--; render(); }
  else if (action === 'submit-create-room') createRoom(state.form.onlineCount, state.form.onlineName);
  else if (action === 'submit-join-room') joinRoom(state.form.joinCode, state.form.joinName);
  else if (action === 'start-online-game') startOnlineGame();
  else if (action === 'leave-room') leaveRoom();
  else if (action === 'copy-code') {
    if (state.online) {
      navigator.clipboard?.writeText(state.online.code).then(() => showToast('Oda kodu kopyalandı'));
    }
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-name-idx]')) {
    state.names[parseInt(t.dataset.nameIdx, 10)] = t.value;
  }
  if (t.matches('[data-form-field]')) {
    const field = t.dataset.formField;
    state.form[field] = field === 'joinCode' ? t.value.toUpperCase() : t.value;
  }
});

render();
</script>
</body>
